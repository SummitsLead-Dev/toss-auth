<!DOCTYPE html>
<html>
<head>
    <title>Authenticating...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                // アプリを呼び出す
                window.location.href = "tossfornotion://auth?code=" + code;
                
                // 表示を切り替えて「戻れる」ことを伝える
                setTimeout(function() {
                    document.getElementById('status').innerHTML = `
                        <div style="padding: 20px; border-radius: 10px; background: #e8f5e9; color: #2e7d32;">
                            <h3>Authentication Success!</h3>
                            <p>You can now close this tab and return to the app.</p>
                            <button onclick="window.close()" style="padding: 10px 20px; cursor: pointer;">Close this tab</button>
                        </div>
                    `;
                }, 1000);
            } else {
                document.getElementById('status').innerText = "Authorization code not found.";
            }
        };
    </script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding-top: 100px; background: #fafafa; }
    </style>
</head>
<body>
    <div id="status">Connecting to Toss for Notion...</div>
</body>
</html>
