<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toss for Notion — アプリに戻る</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center;
         justify-content: center; min-height: 90vh; margin: 0; padding: 24px; text-align: center;
         background: #fafafa; color: #333; }
  .btn { display: inline-block; margin-top: 24px; padding: 16px 40px; border-radius: 12px;
         background: #7E57C2; color: #fff; font-size: 18px; font-weight: bold;
         text-decoration: none; }
  .note { margin-top: 16px; font-size: 13px; color: #888; }
</style>
</head>
<body>
  <h2>ログインが完了しました</h2>
  <p>ボタンをタップしてアプリに戻ってください。<br>Tap the button to return to the app.</p>
  <a id="return-btn" class="btn" href="#">アプリに戻る / Return to App</a>
  <p class="note">ボタンが機能しない場合は、アプリを一度開き直してから再度ログインしてください。</p>
  <script>
    // code / state などのクエリをそのままカスタムスキームへ引き継ぐ
    var target = "tossfornotion://auth" + window.location.search;
    document.getElementById("return-btn").setAttribute("href", target);
    // 自動遷移も試みる（ブラウザにブロックされたらボタンで戻る）
    setTimeout(function () { window.location.href = target; }, 300);
  </script>
</body>
</html>
